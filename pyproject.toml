[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-openai"
version = "0.1.0"
description = "A sample LangGraph workflow powered by OpenAI."
readme = "src/langgraph_openai/README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
langgraph-openai = "langgraph_openai.main:main"

[tool.setuptools.packages.find]
where = ["src"]
